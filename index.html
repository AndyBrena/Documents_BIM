<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Enlaces</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .category {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
    }

    .category h2 {
      font-size: 1.1rem;
      color: #38bdf8;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1rem;
      background-color: #0f172a;
      color: #f1f5f9;
      text-decoration: none;
      text-align: center;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #475569;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      transform: translateY(-2px);
    }

    footer {
      margin-top: auto;
      padding-top: 2rem;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PANEL DE ENLACES</h1>
    <p>Accesos directos del proyecto</p>
  </div>

  <div class="container">

    <!-- SECCIÓN 1 -->
    <div class="category">
      <h2>BIM 360 & Modelos</h2>
      <div class="button-group">
        <a href="https://docs.b360.autodesk.com" target="_blank" class="btn">Planos de Obra Aprobados</a>
        <a href="https://docs.b360.autodesk.com" target="_blank" class="btn">Modelos de Construcción</a>
        <a href="https://model.b360.autodesk.com" target="_blank" class="btn">Modelos de Coordinación BIM</a>
      </div>
    </div>

    <!-- SECCIÓN 2 -->
    <div class="category">
      <h2>Documentación del Proyecto</h2>
      <div class="button-group">
        <a href="https://google.com" target="_blank" class="btn">Manual de Gestión BIM</a>
        <a href="https://google.com" target="_blank" class="btn">Especificaciones Técnicas</a>
      </div>
    </div>

  </div>

  <footer>
    <p>SuperLink Hub © 2026</p>
  </footer>

</body>
</html>
